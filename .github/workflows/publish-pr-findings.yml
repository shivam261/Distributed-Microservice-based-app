name: Publish PR scan findings

on:
  workflow_run:
    workflows: [PR security and quality]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

concurrency:
  group: publish-pr-scan-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Execute only the trusted default-branch publisher, never code from the PR.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check the source workflow and artifact size
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/pr-scan.yml' ||
                run.repository.id !== context.payload.repository.id) {
              throw new Error('Unexpected scan workflow');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100,
            });
            const reports = artifacts.filter(item => item.name === 'pr-scan-report' && !item.expired);
            if (reports.length !== 1 || reports[0].size_in_bytes > 200000) {
              throw new Error('Missing, duplicate, expired, or oversized scan report');
            }
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: pr-scan-report
          path: ${{ runner.temp }}/untrusted-pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create or update the PR's tracking issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REPORT_PATH: ${{ runner.temp }}/untrusted-pr-report/report.json
        with:
          script: |
            const publish = require('./.github/scripts/publish_findings.cjs');
            await publish({ github, context, core, reportPath: process.env.REPORT_PATH });

